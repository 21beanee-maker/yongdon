<style>
:root{
  --paper:#EEF5FB; --sheet:#FFFFFF; --rule:#D3E3F0; --line2:#E3EDF6;
  --ink:#24324F; --muted:#64708C; --in:#16866A; --out:#D9483F; --hl:#FFE45C; --hlink:#3D3000; --onbtn:#FFFFFF;
  --ko:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --head:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141B2A; --sheet:#1C2537; --rule:#2C3850; --line2:#242F45;
    --ink:#EDF1F8; --muted:#A2AEC7; --in:#4FD1A8; --out:#FF7A70; --hl:#E6C84A; --hlink:#2A2100; --onbtn:#10151F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141B2A; --sheet:#1C2537; --rule:#2C3850; --line2:#242F45;
  --ink:#EDF1F8; --muted:#A2AEC7; --in:#4FD1A8; --out:#FF7A70; --hl:#E6C84A; --hlink:#2A2100; --onbtn:#10151F; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ko);font-size:17px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--line2) 31px,var(--line2) 32px);
  padding-bottom:calc(158px + env(safe-area-inset-bottom,0px));-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid var(--in);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--head);font-weight:400;margin:0;line-height:1.25}

header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
header.top h1{font-size:25px}
.iconbtn{border:0;background:none;cursor:pointer;min-width:44px;min-height:44px;border-radius:12px;color:var(--muted);font-size:15px;padding:0 8px}

.hero{display:grid;grid-template-columns:128px 1fr;gap:10px;align-items:center;background:var(--sheet);border-radius:24px;padding:12px 14px 14px 8px;border:2px solid var(--rule);margin-top:4px;position:relative}
.pigwrap{position:relative;width:128px;height:106px;cursor:pointer;border:0;background:none;padding:0}
.pig{width:128px;height:106px;display:block;overflow:visible}
.pig.pink{--pb:#FFB3C7;--ps:#D96A8C;--pn:#FF8FB0;--pd:#8C3B57;--pe:#3A2230;--pc:#FF7FA6;--pf:#FFE45C}
.pig.gold{--pb:#F9D35B;--ps:#B9861A;--pn:#F2B630;--pd:#7A5300;--pe:#3B2A00;--pc:#F08C3C;--pf:#FFF7CF}
.pig .lvl{transition:y .7s ease}
.pig.bounce{animation:bounce .5s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}60%{transform:translateY(2px)}}
.coin{transform-box:fill-box;transform-origin:center;opacity:0}
.coin.drop{animation:drop .65s cubic-bezier(.5,0,.8,.6)}
.coin.pop{animation:pop .8s ease-out}
@keyframes drop{0%{opacity:1;transform:translate(0,-60px)}80%{opacity:1;transform:translate(0,4px)}100%{opacity:0;transform:translate(0,10px)}}
@keyframes pop{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(26px,-58px) rotate(40deg)}}
.face>g{display:none}
.pig[data-face="normal"] .f-normal,.pig[data-face="happy"] .f-happy,.pig[data-face="wow"] .f-wow,.pig[data-face="oops"] .f-oops,.pig[data-face="sleepy"] .f-sleepy{display:inline}
.bubble{position:relative;background:var(--paper);border-radius:14px;padding:7px 11px;font-size:14px;line-height:1.35;margin-bottom:6px}
.bubble::before{content:"";position:absolute;left:-7px;top:12px;border:7px solid transparent;border-left:0;border-right-color:var(--paper)}
.streak[hidden]{display:none}
.streak{display:inline-block;font-size:13px;background:var(--paper);border-radius:99px;padding:1px 9px;margin-left:4px;vertical-align:3px;font-family:var(--ko)}
.nospend{width:100%;margin-top:10px;border:2px dashed var(--rule);background:var(--sheet);border-radius:16px;min-height:50px;cursor:pointer;font-family:var(--head);font-size:17px;color:var(--in)}
.nospend[disabled]{color:var(--muted);cursor:default;border-style:solid}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.stk{text-align:center;background:var(--paper);border-radius:16px;padding:10px 4px;font-size:13px;line-height:1.3}
.stk span{display:block;font-size:34px;line-height:1.2}
.stk.lock span{filter:grayscale(1);opacity:.3}
.stk.lock{color:var(--muted)}
.celebrate{text-align:center;padding:6px 0 4px}
.celebrate .s{font-size:84px;line-height:1.1;animation:spin .7s ease}
@keyframes spin{0%{transform:scale(.2) rotate(-30deg)}70%{transform:scale(1.15) rotate(8deg)}100%{transform:none}}
.skins{display:flex;gap:10px}
.skin{flex:1;border:2px solid var(--rule);background:var(--paper);border-radius:16px;padding:8px;cursor:pointer;font-family:var(--head);font-size:16px}
.skin svg{width:90px;height:74px;display:block;margin:0 auto}
.skin[aria-pressed="true"]{border-color:var(--ink);background:var(--sheet)}
.toggle{display:flex;align-items:center;justify-content:space-between;min-height:48px;font-size:16px}
.toggle input{width:24px;height:24px;accent-color:var(--in)}
.hero .lbl{color:var(--muted);font-size:15px}
.hero .bal{font-family:var(--head);font-size:clamp(26px,8.2vw,38px);line-height:1.1;margin:2px 0 6px;white-space:nowrap}
.hero .goalline{font-size:14px;color:var(--muted)}
.hero .goalline b{font-weight:400;background:var(--hl);color:var(--hlink);padding:0 4px;border-radius:4px}

.notice{margin-top:10px;background:var(--sheet);border:2px solid var(--rule);border-left:6px solid var(--hl);border-radius:14px;padding:10px 14px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.notice button{flex:0 0 auto}

.month{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--sheet);border:2px solid var(--rule);border-radius:18px;overflow:hidden;margin-top:12px}
.month div{padding:10px 6px;text-align:center}
.month div+div{border-left:2px dashed var(--rule)}
.month span{display:block;font-size:13px;color:var(--muted)}
.month b{font-family:var(--head);font-weight:400;font-size:18px}
.c-in{color:var(--in)} .c-out{color:var(--out)}
.budget{margin-top:10px;background:var(--sheet);border:2px solid var(--rule);border-radius:16px;padding:10px 14px;font-size:15px}
.meter{height:12px;background:var(--rule);border-radius:99px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--in);border-radius:99px;transition:width .4s}
.meter.warn i{background:var(--out)}

h2{font-size:21px;margin:20px 0 8px}
.list{display:grid;gap:8px}
.entry{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--sheet);border:2px solid var(--rule);border-radius:16px;padding:10px 12px;cursor:pointer;text-align:left;width:100%;min-height:60px}
.entry .em{font-size:24px;text-align:center}
.entry .t{font-size:16px;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis}
.entry .t small{display:block;color:var(--muted);font-size:13px}
.entry .a{font-family:var(--head);font-size:19px;white-space:nowrap;text-align:right;line-height:1.2}
.entry .a small{display:block;font-family:var(--ko);font-size:12px;color:var(--muted)}
.empty{background:var(--sheet);border:2px dashed var(--rule);border-radius:16px;padding:18px;text-align:center;color:var(--muted)}

/* ledger as day groups */
.mnav{display:flex;align-items:center;justify-content:space-between;margin:12px 0 10px}
.mnav h2{margin:0}
.mnav button{border:2px solid var(--rule);background:var(--sheet);border-radius:12px;width:48px;height:44px;cursor:pointer;font-size:18px}
.carry{display:flex;justify-content:space-between;background:var(--sheet);border:2px dashed var(--rule);border-radius:14px;padding:10px 14px;color:var(--muted);font-size:15px;margin-bottom:8px}
.carry b{font-family:var(--head);font-weight:400;color:var(--ink)}
.day{font-family:var(--head);font-size:16px;color:var(--muted);margin:12px 4px 6px}
.totals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.totals div{background:var(--sheet);border:2px solid var(--rule);border-radius:14px;padding:8px;text-align:center}
.totals span{display:block;font-size:13px;color:var(--muted)}
.totals b{font-family:var(--head);font-weight:400;font-size:17px}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 0}

/* chart & goal */
.card{background:var(--sheet);border:2px solid var(--rule);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.card h3{font-size:18px;margin-bottom:10px}
.hbar{display:grid;grid-template-columns:100px 1fr 74px;gap:8px;align-items:center;margin:8px 0;font-size:15px}
.hbar .track{height:18px;background:var(--rule);border-radius:99px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--out);border-radius:99px}
.hbar .v{text-align:right;font-family:var(--head)}
.chartsvg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:14px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.goalcard{text-align:center}
.goalcard .gname{font-family:var(--head);font-size:26px;margin:4px 0}
.goalcard .gpct{font-family:var(--head);font-size:44px;line-height:1.1}
.bigmeter{height:22px;background:var(--rule);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.bigmeter i{display:block;height:100%;background:var(--hl);border-radius:99px}
.field{display:grid;gap:6px;margin:12px 0}
.field label{font-size:15px;color:var(--muted)}
.inp{width:100%;border:2px solid var(--rule);background:var(--paper);border-radius:14px;padding:12px 14px;font-size:18px;min-height:50px}
.inp:focus{outline:none;border-color:var(--in)}
.btn{border:2px solid var(--rule);background:var(--sheet);border-radius:999px;padding:10px 18px;cursor:pointer;font-family:var(--head);font-size:17px;min-height:48px}
.btn.main{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--out);border-color:color-mix(in srgb,var(--out) 50%,var(--rule))}
.btn.wide{width:100%}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2 .btn{flex:1 1 auto}

/* thumb zone: action bar + nav */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:2px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px 6px;max-width:560px;margin:0 auto}
.bigbtn{border:0;border-radius:18px;min-height:56px;cursor:pointer;font-family:var(--head);font-size:21px;color:var(--onbtn)}
.bigbtn.in{background:var(--in)} .bigbtn.out{background:var(--out)}
.bigbtn:active{transform:scale(.97)}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;margin:0 auto}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px;text-decoration:none;color:var(--muted);font-size:13px}
nav.tabs a span{font-size:21px;line-height:1.15;filter:grayscale(.6);opacity:.7}
nav.tabs a[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs a[aria-current="page"] span{filter:none;opacity:1}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,30,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--sheet);border-radius:24px 24px 0 0;max-height:94vh;max-height:94dvh;overflow:auto;-webkit-overflow-scrolling:touch;transform:translateY(105%);transition:transform .25s ease;padding:14px 0 calc(16px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sheet h3{font-size:21px;margin-bottom:4px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--rule);margin:0 auto 10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:14px;padding:4px;gap:4px;margin:8px 0}
.seg button{border:0;border-radius:11px;min-height:46px;cursor:pointer;background:none;font-family:var(--head);font-size:17px;color:var(--muted)}
.seg button[aria-pressed="true"].in{background:var(--in);color:var(--onbtn)}
.seg button[aria-pressed="true"].out{background:var(--out);color:var(--onbtn)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;border:2px solid var(--rule);background:var(--paper);border-radius:14px;min-width:74px;min-height:64px;padding:6px 8px;cursor:pointer;text-align:center;font-size:13px;line-height:1.2}
.cat span{display:block;font-size:24px}
.cat[aria-pressed="true"]{border-color:var(--ink);background:var(--sheet)}
.amtline{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;border-bottom:3px solid var(--rule);padding:2px 4px;margin-top:6px}
.amtline b{font-family:var(--head);font-weight:400;font-size:42px;line-height:1.15}
.amtline b.zero{color:var(--muted)}
.amtline span{font-family:var(--head);font-size:22px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.quick button{border:2px solid var(--rule);background:var(--paper);border-radius:12px;min-height:44px;cursor:pointer;font-size:15px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{border:0;background:var(--paper);border-radius:14px;min-height:52px;font-family:var(--head);font-size:24px;cursor:pointer}
.pad button:active{background:var(--rule)}
.memo{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:10px}
.memo .inp{min-height:46px;font-size:16px;padding:10px 12px}
.datebtn{border:2px solid var(--rule);background:var(--paper);border-radius:14px;min-height:46px;padding:0 12px;font-size:15px;position:relative;overflow:hidden;display:flex;align-items:center}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{border:2px dashed var(--rule);background:none;border-radius:999px;min-height:40px;padding:4px 12px;cursor:pointer;font-size:14px}
.err{color:var(--out);font-size:14px;min-height:20px;margin:6px 0 2px}
.savebar{display:flex;gap:8px;margin-top:6px}
.savebar .btn{flex:1}
.ask{text-align:center;padding:10px 0}
.ask .big{font-family:var(--head);font-size:36px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;z-index:40;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.status{font-size:13px;color:var(--muted);text-align:center;margin:16px 0 0}
section[hidden]{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<body>
<div class="wrap">
  <header class="top"><h1 id="title">나의 용돈기입장</h1><button class="iconbtn" type="button" id="openSettings">⚙️ 설정</button></header>

        <path d="M104 38 q5 -12 13 -9 q-3 9 -9 12z" fill="var(--pn)"/>

      <div>

<script>
(function(){
const KEY='allowance-book-v2';
const CATS={
  in:[{k:'allow',e:'💰',n:'용돈'},{k:'chore',e:'🧹',n:'심부름'},{k:'gift',e:'🎁',n:'선물·세뱃돈'},{k:'etc',e:'✨',n:'기타'}],
  out:[{k:'snack',e:'🍪',n:'간식'},{k:'school',e:'✏️',n:'학용품'},{k:'toy',e:'🧸',n:'장난감·게임'},{k:'present',e:'🎀',n:'선물'},{k:'trans',e:'🚌',n:'교통'},{k:'book',e:'📚',n:'책'},{k:'etc',e:'📦',n:'기타'}]
};
const cat=(t,k)=>(CATS[t].find(c=>c.k===k)||CATS[t][CATS[t].length-1]);
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const monKey=d=>d.slice(0,7);
const $=id=>document.getElementById(id);
const josa=(w,a,b)=>{const ch=w.charCodeAt(w.length-1)-0xAC00;return w+(ch>=0&&ch<11172&&ch%28?a:b);};

/* ---------- data ---------- */
let S={settings:null,entries:[],lastBackup:0,checkins:[],stickers:{},skin:'pink',sound:true};
function load(){try{const v=localStorage.getItem(KEY);if(v){const o=JSON.parse(v);if(o&&Array.isArray(o.entries))S=Object.assign(S,o);}}catch(e){}
  if(!Array.isArray(S.checkins))S.checkins=[]; if(!S.stickers||typeof S.stickers!=='object')S.stickers={}; if(S.skin!=='gold')S.skin='pink'; if(S.sound!==false)S.sound=true;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('저장 공간이 부족해서 저장하지 못했어요');}}
load();
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}

const sorted=()=>S.entries.slice().sort((a,b)=>(a.d<b.d?-1:a.d>b.d?1:(a.ts||0)-(b.ts||0)));
const startBal=()=>(S.settings&&+S.settings.start)||0;
const balance=()=>S.entries.reduce((s,e)=>s+(e.t==='in'?e.a:-e.a),startBal());
function monthTotals(m){let i=0,o=0;S.entries.forEach(e=>{if(monKey(e.d)===m){e.t==='in'?i+=e.a:o+=e.a;}});return {i,o};}
let viewMon=monKey(today());

/* ---------- days, streak, pig ---------- */
function recordedDays(){const set=new Set(S.checkins); S.entries.forEach(e=>set.add(e.d)); return set;}
function addDays(d,k){const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()+k); return ymd(x);}
function streak(){const set=recordedDays(); let d=today(); if(!set.has(d)) d=addDays(d,-1); let n=0; while(set.has(d)){n++; d=addDays(d,-1);} return n;}
function idleDays(){const set=recordedDays(); if(!set.size) return 0; let d=today(),n=0; while(!set.has(d)&&n<400){n++; d=addDays(d,-1);} return n;}
let flash=null; // {face,say,until}
function pigState(){
  if(flash&&Date.now()<flash.until) return flash;
  const set=recordedDays(), idle=idleDays(), sk=streak();

function tone(freqs,dur,type){ if(!S.sound) return; try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume();
  const t0=actx.currentTime;

    const st=t0+i*0.07; g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.22,st+0.01); g.gain.exponentialRampToValueAtTime(0.0001,st+dur);
    o.connect(g); g.connect(actx.destination); o.start(st); o.stop(st+dur+0.02);});
}catch(e){} }

  if(!d.orig){ if(e.t==='in') setFlash('wow','짤랑! '+won(e.a)+' 냠냠, 배부르다 꿀꿀'); else setFlash(e.a>=5000?'oops':'normal',e.a>=5000?'앗, '+won(e.a)+'이나 나갔어! 꼭 필요한 거였지?':won(e.a)+' 나갔어. 기록해 줘서 고마워!'); }
  closeSheet(); checkStickers(); render(); toast(msg);
  if(!d.orig){ if(location.hash&&location.hash!=='#home') location.hash='home'; setTimeout(()=>{animatePig(e.t); e.t==='in'?sndCoin():sndOut();},120); }
  if(stkQueue.length) setTimeout(showNextSticker,900);
}
function askDelete(){
  openSheet('<div class="ask"><p>이 기록을 지울까요?</p><div class="big">'+esc(draft.memo||cat(draft.t,draft.c).n)+'</div><p>'+won(draft.a)+'</p></div><div class="savebar"><button class="btn" type="button" data-back>아니요</button><button class="btn main" type="button" data-delok style="background:var(--out);border-color:var(--out)">지울래요</button></div>','ask');
}
function openSettings(first){
  const st=S.settings||{};
  openSheet('<h3>'+(first?'처음 시작하기':'설정')+'</h3>'+(first?'<p class="hint" style="margin:0 0 4px">이름과 지금 가진 돈을 적으면 바로 시작할 수 있어요.</p>':'')+
    '<div class="field"><label for="sName">이름</label><input class="inp" id="sName" maxlength="10" placeholder="예: 서윤" value="'+esc(st.name)+'"></div>'+
    '<div class="field"><label for="sStart">처음에 가지고 있던 돈</label><input class="inp" id="sStart" inputmode="numeric" pattern="[0-9]*" placeholder="예: 5000" value="'+esc(st.start||'')+'"></div>'+
    '<p class="hint" style="margin-top:0">기입장을 쓰기 전에 지갑이나 저금통에 있던 돈이에요.</p>'+
    '<div class="savebar">'+(first?'':'<button class="btn" type="button" data-close>닫기</button>')+'<button class="btn main" type="button" data-setsave>저장</button></div>'+
    (first?'<p class="hint" style="margin-top:14px">전에 백업한 파일이 있다면 <button class="btn" type="button" data-restore style="min-height:40px">백업 불러오기</button></p>':
    '<h3 style="margin-top:20px">내 돼지 저금통</h3><div class="skins"><button type="button" class="skin" data-skin="pink" aria-pressed="'+(S.skin!=='gold')+'"><svg viewBox="0 0 170 140" class="pig pink"><g fill="var(--pb)" stroke="var(--ps)" stroke-width="4"><rect x="42" y="102" width="16" height="22" rx="6"/><rect x="112" y="102" width="16" height="22" rx="6"/><ellipse cx="80" cy="76" rx="58" ry="44"/></g><path d="M98 40 q6 -26 24 -16 q-4 16 -14 22z" fill="var(--pb)" stroke="var(--ps)" stroke-width="4"/><rect x="60" y="36" width="30" height="7" rx="3.5" fill="var(--pd)"/><ellipse cx="138" cy="80" rx="15" ry="17" fill="var(--pn)" stroke="var(--ps)" stroke-width="4"/><circle cx="114" cy="64" r="5" fill="var(--pe)"/></svg>핑크 돼지</button><button type="button" class="skin" data-skin="gold" aria-pressed="'+(S.skin==='gold')+'"><svg viewBox="0 0 170 140" class="pig gold"><g fill="var(--pb)" stroke="var(--ps)" stroke-width="4"><rect x="42" y="102" width="16" height="22" rx="6"/><rect x="112" y="102" width="16" height="22" rx="6"/><ellipse cx="80" cy="76" rx="58" ry="44"/></g><path d="M98 40 q6 -26 24 -16 q-4 16 -14 22z" fill="var(--pb)" stroke="var(--ps)" stroke-width="4"/><rect x="60" y="36" width="30" height="7" rx="3.5" fill="var(--pd)"/><ellipse cx="138" cy="80" rx="15" ry="17" fill="var(--pn)" stroke="var(--ps)" stroke-width="4"/><circle cx="114" cy="64" r="5" fill="var(--pe)"/></svg>황금 돼지</button></div>'+
    '<label class="toggle"><span>효과음 켜기</span><input type="checkbox" id="sndToggle"'+(S.sound?' checked':'')+'></label>'+
    '<h3 style="margin-top:22px">백업</h3><p class="hint" style="margin:2px 0 8px">기록은 이 휴대폰에만 있어요. 백업 파일을 카톡이나 파일 앱에 저장해 두면 휴대폰을 바꿔도 되살릴 수 있어요.'+(S.lastBackup?' 마지막 백업: '+fmtDate(ymd(new Date(S.lastBackup))):'')+'</p><div class="row2"><button class="btn main" type="button" data-backup>백업 파일 만들기</button><button class="btn" type="button" data-restore>백업 불러오기</button></div>'+
    '<h3 style="margin-top:22px">처음부터 다시</h3><p class="hint" style="margin:2px 0 8px">모든 기록을 지워요. 지우기 전에 백업해 두세요.</p><button class="btn danger" type="button" data-reset>모든 기록 지우기</button>'),'settings');
}
function saveSettings(){const name=$('sName').value.trim(), start=$('sStart').value.replace(/[^0-9]/g,'');
  S.settings=Object.assign({},S.settings||{},{name,start:start?+start:0}); save(); closeSheet(); render(); toast('저장했어요');}

/* ---------- backup ---------- */
async function backup(){
  const data=JSON.stringify({app:'allowance-book',version:3,exported:new Date().toISOString(),settings:S.settings,entries:S.entries,checkins:S.checkins,stickers:S.stickers,skin:S.skin});
  const name=(S.settings&&S.settings.name?S.settings.name+'_':'')+'용돈기입장_백업_'+today()+'.json';
  const file=new File([data],name,{type:'application/json'});
  try{
    const dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;
    if(dl){ await dl.save({filename:name,data:new Blob([data],{type:'application/json'})}); }
    else if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'용돈기입장 백업'}); }
    else { const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); }
    S.lastBackup=Date.now(); save(); checkStickers(); render(); if(stkQueue.length&&sheetKind!=='settings')setTimeout(showNextSticker,600); if(sheetKind==='settings')openSettings(false); toast('백업 파일을 만들었어요');
  }catch(e){ if(e&&(e.name==='AbortError'||e.code==='declined')) return; toast('백업 파일을 만들지 못했어요'); }
}
document.addEventListener('change',e=>{ if(e.target.id==='sndToggle'){S.sound=e.target.checked;save(); if(S.sound)sndCoin();} });
$('restoreFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(!o||o.app!=='allowance-book'||!Array.isArray(o.entries)) throw 0;
      const cnt=o.entries.length;
      openSheet('<div class="ask"><p>백업 파일에 기록 '+cnt+'개가 있어요.<br>지금 기록을 이 파일 내용으로 바꿀까요?</p></div><div class="savebar"><button class="btn" type="button" data-close>아니요</button><button class="btn main" type="button" id="doRestore">바꿀래요</button></div>','ask');
      $('doRestore').onclick=()=>{S.settings=o.settings||null;S.entries=o.entries.filter(x=>x&&x.id&&(x.t==='in'||x.t==='out')&&+x.a>0&&/^\d{4}-\d{2}-\d{2}$/.test(x.d)).map(x=>({id:String(x.id),t:x.t,a:+x.a,c:String(x.c||'etc'),memo:String(x.memo||'').slice(0,30),d:x.d,ts:+x.ts||0}));S.checkins=Array.isArray(o.checkins)?o.checkins.filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)):[];S.stickers=(o.stickers&&typeof o.stickers==='object')?o.stickers:{};S.skin=o.skin==='gold'?'gold':'pink';save();closeSheet();render();toast('백업을 불러왔어요');};
    }catch(err){ toast('용돈기입장 백업 파일이 아니에요'); } };
  rd.readAsText(f);
});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const c=s=>e.target.closest(s); let b;
  if(b=c('[data-add]')){openAdd(b.dataset.add);return;}
  if(b=c('[data-edit]')){const en=S.entries.find(x=>x.id===b.dataset.edit); if(en)openAdd(en.t,en); return;}
  if(b=c('[data-mon]')){viewMon=shiftMon(viewMon,+b.dataset.mon);renderBook();renderChart();return;}
  if(c('#scrim')){ if(S.settings) closeSheet(); return;}
  if(c('[data-close]')){closeSheet();if(!S.settings)openSettings(true);return;}
  if(c('#openSettings')){openSettings(!S.settings);return;}
  if(c('#nospend')){const t=today(); if(!recordedDays().has(t)){S.checkins.push(t);save();setFlash('happy','아껴 쓴 날! 최고야 꿀꿀 🍀');checkStickers();render();animatePig('none');sndCoin();toast('오늘은 안 쓴 날로 기록했어요'); if(stkQueue.length)setTimeout(showNextSticker,900);} return;}
  if(c('#pigbtn')){const says=['꿀꿀! 오늘도 반가워','나를 꽉 채워 줘!','배고프다… 동전 줄래?','간지러워 꿀꿀!','목표까지 같이 가자!'];setFlash('happy',says[Math.floor(Math.random()*says.length)]);renderHome();animatePig('none');sndOink();return;}
  if(c('[data-stknext]')){closeSheet(); if(stkQueue.length)setTimeout(showNextSticker,250); return;}
  if(b=c('[data-skin]')){S.skin=b.dataset.skin;save();render();$('sheetBody').querySelectorAll('[data-skin]').forEach(x=>x.setAttribute('aria-pressed',x===b));return;}
  if(c('[data-setsave]')){saveSettings();return;}
  if(c('[data-backup]')){backup();return;}
  if(c('[data-restore]')){$('restoreFile').click();return;}
  if(c('[data-reset]')){openSheet('<div class="ask"><p>모든 기록과 설정을 지울까요?<br>되돌릴 수 없어요.</p></div><div class="savebar"><button class="btn" type="button" data-close>아니요</button><button class="btn main" type="button" data-resetok style="background:var(--out);border-color:var(--out)">모두 지울래요</button></div>','ask');return;}
  if(c('[data-resetok]')){S={settings:null,entries:[],lastBackup:0,checkins:[],stickers:{},skin:'pink',sound:true};save();closeSheet();render();openSettings(true);return;}
  if(draft){
    if(b=c('[data-t]')){if(draft.t!==b.dataset.t){draft.t=b.dataset.t;draft.c=CATS[draft.t][0].k;}drawAdd();return;}
    if(b=c('[data-c]')){draft.c=b.dataset.c;$('sheetBody').querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed',x===b));return;}
    if(b=c('[data-again]')){const en=S.entries.find(x=>x.id===b.dataset.again); if(en){draft.c=en.c;draft.a=en.a;draft.memo=en.memo;$('fMemo').value=en.memo;updAmt();$('sheetBody').querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===en.c));} return;}
    if(b=c('[data-q]')){draft.a=Math.min(99999999,(draft.a||0)+(+b.dataset.q));updAmt();return;}
    if(b=c('[data-k]')){const k=b.dataset.k; let s=String(draft.a||'');
      if(k==='⌫') s=s.slice(0,-1); else if(s.length<8) s=(s==='0'?'':s)+k;
      draft.a=+(s.replace(/^0+/,'')||0); updAmt(); return;}
    if(c('[data-save]')){trySave(false);return;}
    if(c('[data-force]')){commit();return;}
    if(c('[data-back]')){drawAdd();return;}
    if(c('[data-del]')){askDelete();return;}
    if(c('[data-delok]')){S.entries=S.entries.filter(x=>x.id!==draft.orig);save();closeSheet();render();toast('지웠어요');return;}
  }
  if(c('#gSave')){const n=$('gName').value.trim(),a=+$('gAmt').value.replace(/[^0-9]/g,'');
    if(!n||!a){$('gErr').textContent='사고 싶은 것과 필요한 돈을 모두 적어 주세요.';return;} $('gErr').textContent='';
    S.settings=Object.assign({},S.settings||{},{goalName:n,goalAmt:a});save();checkStickers();render();if(stkQueue.length)setTimeout(showNextSticker,600);document.activeElement.blur();toast('목표를 저장했어요');return;}
  if(c('#bSave')){const a=+$('bAmt').value.replace(/[^0-9]/g,'');
    S.settings=Object.assign({},S.settings||{},{budget:a||0});save();render();document.activeElement.blur();toast(a?'한 달 '+won(a)+'만 쓰기로 약속했어요':'약속을 지웠어요');return;}
});
let toastT=null;
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2000);}

/* ---------- routing ---------- */
const VIEWS=['home','book','chart','goal'];
function show(){let v=(location.hash||'').slice(1); if(!VIEWS.includes(v))v='home';
  VIEWS.forEach(x=>$('v-'+x).hidden=x!==v);
  document.querySelectorAll('nav.tabs a').forEach(a=>a.dataset.tab===v?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  window.scrollTo(0,0);}
window.addEventListener('hashchange',show);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){viewMon=viewMon;render();}});
checkStickers(); stkQueue=[]; render(); show();
if(!S.settings) openSettings(true);
})();
</script>
</body>
</html>
